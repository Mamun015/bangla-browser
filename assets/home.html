<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>হোম</title>
<style>
  :root{
    --bg:#ffffff; --surface:#f2f6f4; --text:#111714; --muted:#68736d;
    --accent:#006a4e; --red:#f42a41; --line:#e2e9e5; --shadow:0 1px 2px rgba(17,23,20,.06);
  }
  html.dark{
    --bg:#0f1211; --surface:#191f1d; --text:#e9efec; --muted:#8b9791;
    --accent:#2bbd8f; --line:#242c29; --shadow:none;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg)}
  body{
    color:var(--text);padding:20px 16px 36px;
    font-family:"Noto Sans Bengali","Hind Siliguri",sans-serif;
    transition:background .2s;
  }
  .head{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .logo{
    width:46px;height:46px;border-radius:14px;flex:none;display:block;
    box-shadow:var(--shadow);
  }
  .head h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px}
  .head p{margin:3px 0 0;font-size:12px;color:var(--muted)}
  form{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:18px;padding:5px 5px 5px 15px;
  }
  form svg{flex:none;opacity:.5}
  input{
    flex:1;border:0;background:transparent;color:var(--text);
    font-size:15px;font-family:inherit;outline:none;padding:11px 0;
  }
  input::placeholder{color:var(--muted)}
  button{
    border:0;background:var(--accent);color:#fff;font-family:inherit;
    font-size:14px;font-weight:600;padding:11px 18px;border-radius:14px;
  }
  button:active{transform:scale(.97)}
  h2{
    font-size:12px;color:var(--muted);font-weight:600;
    margin:28px 0 12px;letter-spacing:.3px;
  }
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .tile{
    display:flex;flex-direction:column;align-items:center;gap:7px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:13px 4px 11px;text-decoration:none;color:var(--text);
  }
  .tile:active{transform:scale(.96)}
  .tile .ico{font-size:21px;line-height:1;height:22px}
  .tile .nm{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.25}
  .recent a{
    display:block;padding:13px 0;border-bottom:1px solid var(--line);
    text-decoration:none;color:var(--text);font-size:14px;
  }
  .recent a:last-child{border-bottom:0}
  .recent .u{display:block;font-size:11px;color:var(--muted);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .recent .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .empty{font-size:12.5px;color:var(--muted);line-height:1.7}
  footer{margin-top:34px;text-align:center;font-size:11px;color:var(--muted)}
  footer b{color:var(--accent);font-weight:600}
</style>
</head>
<body>

  <div class="head">
    <img class="logo" src="icon.png" alt="বাংলা ব্রাউজার">
    <div>
      <h1>বাংলা ব্রাউজার</h1>
      <p>দ্রুত, সহজ, বাংলায়</p>
    </div>
  </div>

  <form onsubmit="event.preventDefault();search()">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input id="q" type="search" placeholder="গুগলে সার্চ করুন" autocomplete="off" enterkeyhint="search">
    <button type="submit">খুঁজুন</button>
  </form>

  <h2>প্রিয় সাইট</h2>
  <div class="tiles">
    <a class="tile" href="https://www.prothomalo.com"><span class="ico">📰</span><span class="nm">প্রথম আলো</span></a>
    <a class="tile" href="https://www.kalerkantho.com"><span class="ico">🗞️</span><span class="nm">কালের কণ্ঠ</span></a>
    <a class="tile" href="https://bangla.bdnews24.com"><span class="ico">📻</span><span class="nm">বিডিনিউজ</span></a>
    <a class="tile" href="https://bn.wikipedia.org"><span class="ico">📚</span><span class="nm">উইকিপিডিয়া</span></a>
    <a class="tile" href="https://m.youtube.com"><span class="ico">▶️</span><span class="nm">ইউটিউব</span></a>
    <a class="tile" href="https://m.facebook.com"><span class="ico">📘</span><span class="nm">ফেসবুক</span></a>
    <a class="tile" href="https://mail.google.com"><span class="ico">✉️</span><span class="nm">জিমেইল</span></a>
    <a class="tile" href="https://www.banglanews24.com"><span class="ico">📡</span><span class="nm">বাংলানিউজ</span></a>
  </div>

  <h2>সাম্প্রতিক</h2>
  <div class="recent" id="recent">
    <p class="empty" id="empty">এখনো কিছু দেখা হয়নি। উপরের বাক্সে লিখে শুরু করুন।</p>
  </div>

  <footer>বাংলা ব্রাউজার <b>১.১.০১</b> · Made in Bangladesh</footer>

<script>
  if (location.hash === "#dark") document.documentElement.className = "dark";

  function search() {
    var q = document.getElementById("q").value.trim();
    if (!q) return;
    location.href = "bangla://search?q=" + encodeURIComponent(q);
  }

  window.setRecent = function (items) {
    if (!items || !items.length) return;
    var box = document.getElementById("recent");
    var empty = document.getElementById("empty");
    if (empty) empty.style.display = "none";
    for (var i = 0; i < items.length; i++) {
      var a = document.createElement("a");
      a.href = items[i].u;
      var t = document.createElement("span");
      t.className = "t";
      t.textContent = items[i].t;
      var u = document.createElement("span");
      u.className = "u";
      u.textContent = items[i].u.replace(/^https?:\/\//, "");
      a.appendChild(t);
      a.appendChild(u);
      box.appendChild(a);
    }
  };
</script>
</body>
</html>
